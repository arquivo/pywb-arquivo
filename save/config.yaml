collections:
  # pywb only gives a timeout to the requests of an index_group: with a plain
  # `live: $live`, a live request on a keep-alive connection the network
  # dropped hangs until the kernel gives up, ~15 min. The timeout is of the
  # connect and of each read, and a timed out GET is retried up to 3 times.
  # The index_group key is the source name the recorder source_filter matches.
  live:
    index_group:
      live: $live
    timeout: 15

frame_insert_html: logic_frame.html
framed_replay: true
autoindex: 30

debug: True
recorder:
   source_coll: live
   rollover_size: 100000000
   rollover_idle_secs: 600
   filename_template: live-{timestamp}-{hostname}-{random}.warc.gz
   source_filter: live

banner_html: banner_blank.html
error_html: not_found_mobile.html
not_found_html: not_found_mobile.html

# This depend on the source code.
#head_insert_html: head_insert.html
#frame_insert_html: frame_insert.html
# error_html: error.html
# not_found_html: not_found.html

# Block requests to Arquivo.pt internal infrastructure and private networks
live_url_filter: pywb_arquivo.live_url_filter:is_url_allowed
