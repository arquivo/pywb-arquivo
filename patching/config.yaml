# The patching collection, where the patched resources are recorded, isn't
# configured on collections: pywb only records into the collections found on
# collections_root, using its archive and indexes folders.
collections_root: /app/collections

collections:
  patching_source:
    sequence:
      -
        index: /app/collections/patching/indexes/
        archive_paths:
          - /app/collections/patching/archive/
        name: patching_resources
      # pywb only gives a timeout to the requests of an index_group, it ignores
      # the timeout of a plain `index:`. The timeout is of the connect and of
      # each read, and a timed out GET is retried up to 3 times.
      # The index_group keys are the source names the recorder source_filter matches.
      -
        index_group:
          ia: memento+https://web.archive.org/web/
        timeout: 5
        name: ia
      -
        index_group:
          live: $live
        timeout: 5
        name: live

recorder:
   source_coll: patching_source
   rollover_size: 100000000
   rollover_idle_secs: 600
   filename_template: patching-{timestamp}-{hostname}-{random}.warc.gz
   source_filter: live|ia

not_found_html: not_found_mobile.html

framed_replay: false
redirect_to_exact: true
enable_auto_fetch: true
autoindex: 30

debug: True

# Block requests to Arquivo.pt internal infrastructure and private networks
live_url_filter: pywb_arquivo.live_url_filter:is_url_allowed
