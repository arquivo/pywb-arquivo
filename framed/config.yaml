collections:

  wayback:
    
    # Example of configuration to use local cdx indexes and an arcproxy server.
    # index_paths: /data/indexes_cdx
    # index_paths:
      # - /data/replay_indexes_zipnum-small/
      # file:///data/indexes_cdx/
      # /data/indexes_cdx/
    
    # Example to configure zipnum index with shard resolver
    #
    # index:
    #   type: zipnum
    #   path: /data/indexes_cdx/awp.idx

      # Omit shard_index_loc to use the default LocMapResolver
      # This will look for awp.loc in the same directory as awp.idx
      # The .loc file should contain tab-delimited entries like:
      # awp-0.cdx.gz	awp-0.cdx.gz
      # awp-1.cdx.gz	awp-1.cdx.gz
      # 
      # Relative paths in the .loc file are resolved relative to the .loc file's directory
      # This loads all shard mappings into memory (~1.5MB for 20K shards)

      # Use LocPrefixResolver to construct shard paths by appending shard names to a prefix
      # This avoids loading a .loc file into memory, which is ideal for large numbers of shards
      # shard_index_loc:
        # Regex pattern to match against the directory path of the .idx file
        # '(.*)' captures the entire directory path: /data/indexes_cdx/
        # match: '(.*)'
        
        # Replacement pattern using the captured group
        # '\1' refers to the captured directory path from the match pattern
        # When a shard name like 'awp-12345.cdx.gz' is needed, it becomes:
        # /data/indexes_cdx/ + awp-12345.cdx.gz = /data/indexes_cdx/awp-12345.cdx.gz
        # replace: '\1'
      
      # Optional: Maximum number of CDX blocks to load per query (default: 10)
      # Higher values = more memory usage but potentially fewer disk reads
      # max_blocks: 1000
      
      # Optional: How often to check if the index files have been modified (in minutes)
      # Only relevant when using LocMapResolver with a .loc file (default: 10)
      # reload_interval: 1440

    # archive_paths:
      # ArcProxy server to fetch archived content
      #
      # - http://p85.arquivo.pt:8080/arcproxy/arcproxy/
      
      # Format: redis://[host]:[port]/[db]/[key_template]
      # The resolver will use HGET pathindex:branchA <filename> to get the full path
      #
      # - redis://localhost:6379/0/pathindex:branchA

    # Development example using Arquivo.pt production environment
    # Example that use Arquivo.pt production environment with Memento API
    #
    index_group:
      arquivo_memento: memento+https://preprod.arquivo.pt/wayback/
    
    # Example that use Arquivo.pt production environment with CDX API
    # index_group:
    #   arquivo_cdx: cdx+http://arquivo.pt/wayback/cdx


    timeout: 30

    # This is a collection of variables that the html templates can use.
    metadata:
      #
      # Example to use the production environment
      #
      arquivoweb_app_url: http://localhost:3000

      #
      # Example to use the preprod environment
      #
      # arquivoweb_app_url: https://preprod.arquivo.pt

      #
      # Example to use the localhost development environment
      #
      # arquivoweb_app_url: http://localhost:3000
      
      # Example that use production environment for screenshots
      screenshot_endpoint: https://arquivo.pt/screenshot
    #  build: hash_or_timestamp  # optional configuration to force browsers use the correct version of each js or css file.
      replayWithOldBrowsers: false
      googleAnalyticsToken: G-6VRZXCHDJ1

# Templates
head_insert_html: head_insert_arquivo.html
frame_insert_html: frame_insert_mobile.html
error_html: error_mobile.html
not_found_html: not_found_mobile.html
banner_html: banner_blank.html


framed_replay: false
redirect_exact: true
debug: true

