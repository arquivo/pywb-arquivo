[uwsgi]
# Http port configuration, defaults to 8081
if-not-env = HTTP_PORT
http-socket =:8081
endif=
if-env = HTTP_PORT
http-socket =:%(_)
endif =

# Socket port configuration, defaults to 8181
if-not-env = SOCKET_PORT
socket =:8181
endif=
if-env = SOCKET_PORT
socket =:%(_)
endif =

# Stats server used by uwsgitop, defaults to a unix socket so it isn't
# reachable from the network, e.g.: uwsgitop /tmp/uwsgi-stats.sock
if-not-env = STATS_SOCKET
stats = /tmp/uwsgi-stats.sock
endif =
if-env = STATS_SOCKET
stats = %(_)
endif =

strict = true
# not needed
# enable-threads = true
vacuum = true
single-interpreter = true
need-app = true

# Disable request logging to reduce log noise
# and only log 4xx and 5xx responses
disable-logging = true
log-4xx = true
log-5xx = true

# Enable master process
master = true

# Set internal buffer size
# Set the max size of a request (request-body excluded),
# this generally maps to the size of request headers. 
# By default it is 4k. If you receive a bigger request 
# (for example with big cookies or query string) you may need to increase it.
# It is a security measure too, so adapt to your app needs instead of maxing
# it out.
buffer-size = 65536
die-on-term = true

# If running in a virtual environment, set the venv path
if-env = VIRTUAL_ENV
venv = $(VIRTUAL_ENV)
endif =

# Number of processes to run, defaults to 4
if-env = PROCESSES
processes = $(PROCESSES)
endif =
if-not-env = PROCESSES
processes = 4
endif =

# Gevent configuration, defaults to 100
# It is a shortcut enabling gevent loop engine with the specified number
# of async cores and optimal parameters.
if-env = GEVENT
gevent = $(GEVENT)
endif =
if-not-env = GEVENT
gevent = 100
endif =

# Index cache, shared by all the workers: the captures read from the index for
# a url are kept for 60 seconds (index_cache.ttl on config.yaml), so the request
# that follows a redirect_to_exact redirect, the lookup of the original of a
# revisit and the cdx/timemap queries for the url don't read the index again.
# Only used for local indexes (CDX(J) files, folders of them and ZipNum).
# 20000 urls and 128 MB (32768 blocks of 4 KB), see "Index Cache (uWSGI)" on the
# pywb docs. Change it with the INDEX_CACHE environment variable, or disable it
# with "index_cache: false" on config.yaml.
if-not-env = INDEX_CACHE
cache2 = name=pywb-index,items=20000,keysize=64,blocksize=4096,blocks=32768,bitmap=1,purge_lru=1,ignore_full=1
endif =
if-env = INDEX_CACHE
cache2 = %(_)
endif =

#Not available until uwsgi 2.1
#monkey-patching manually in pywb.apps.wayback
#gevent-early-monkey-patch =
# for uwsgi<2.1, set env when using gevent
env = GEVENT_MONKEY_PATCH=1

# specify config file here
env = PYWB_CONFIG_FILE=config.yaml
wsgi = pywb.apps.wayback
