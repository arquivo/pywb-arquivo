<script type="text/javascript">
document.write("<script src="+ "{{ wb_prefix }}"+"static\/resources\/js\/js.cookie.js"+ "><\/script>");
</script> <!-- Plugin for cookie to choose language-->
<script>
	var language = localStorage.language;
	if( language == 'EN'){
		document.write('<script type="text/javascript" language="JavaScript" src="{{ static_prefix }}/properties/ConstantsEN.min.js"><\/script>');
	}
	else{
		document.write('<script type="text/javascript" language="JavaScript" src="{{ static_prefix}}/properties/ConstantsPT.min.js"><\/script>');
	}
</script>
<script type="text/javascript">
var tokens = window.location.toString().split('/');
theURL = '';
var i;
for( i = 5; i<tokens.length; i ++){
	if(i == 5){
		theURL = tokens[i];
	}
	else{
		theURL= theURL + "/" + tokens[i];
	}
}

document.write('<div id="pageIsNotArchived"><a href="///?l='+ Content.language +'"><img src="{{ static_prefix }}/img/logoFace.png" class="imgClass" /></a>');
document.write('<h3>'+Content.notArchived+'</h3>');
document.write('<ul>');
    document.write('<li class="list-title">&#x2192; '+Content.weSuggest+'</li>');
    document.write('<li class="fix-padding">'+Content.firstSuggestion+'</li>');
    document.write('<li>'+Content.secondSuggestion+'</li>');
    document.write('<li>'+Content.thirdSuggestion+'</li>');
document.write('</ul>');

$('#otherArchives').on('click', function(e){

            /*gtag('event', 'ReplayBarFunctions', { "action": 'Search Other Archives Click', "label": 'http://arquivo.pt/'+_ts+'/'+_url } );*/
            uglipop({
              class:'modalReplay noprint', //styling class for Modal
              source:'html',
              content:'<h4 class="modalTitleComplete"><i class="fa fa-print" aria-hidden="true"></i> '+Content.otherArchives+'</h4><p class="modalparagraph last">'+Content.leavingArquivo+'</p>'+
                      '<div class="row"><a id="searchOtherArchives" onclick="window.dataLayer = window.dataLayer || []; window.dataLayer.push({ event: \'not_found\', event_category: \'ReplayBarFunctions\', event_action: \'Search Other Archives Click\', event_label: \'arquivo.pt/'+tokens[4]+'/'+theURL+'\' });" class="col-xs-6 text-center leftAnchor modalOptions">OK</a><a id="cancelPopup" class="col-xs-6 text-center modalOptions">'+Content.cancel+'</a></div>'
            });
    /*Closing popup*/            
    $('#cancelPopup').on('click', function(e){
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            "event": 'not_found',
            "event_category": 'Other Archives Cancel',
            "event_label": 'arquivo.pt/'+tokens[4]+'/'+theURL
        });
        $('#uglipop_content_fixed').fadeOut();
        $('#uglipop_overlay').fadeOut('fast');
    });
    /*Confirm searching other archives*/
    $('#searchOtherArchives').on('click', function(e){
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            "event": 'not_found',
            "event_category": 'Other Archives Confirm',
            "event_label": 'arquivo.pt/'+tokens[4]+'/'+theURL
        });
        window.open(Content.otherArchivesURL+'/'+tokens[4]+'/'+theURL);
        $('#uglipop_overlay').fadeOut('fast');
    });
    
});
$('#archiveNow').on('click', function(e){
    window.open(Content.archivePageNowURL);
});
$('#suggestToArquivo').on('click', function(e){
    window.open(Content.suggestURL);
});

// hide replay option when on not archived page
window.parent.document.getElementById("replayMenuButton").style.display = "none";

</script>
