[project]
name = "pywb-arquivo"
version = "0.1.0"
description = "Arquivo.pt pywb instances"
requires-python = "==3.14.*"
dependencies = [
    # faster decompression of the ZipNum index blocks, used by pywb if installed
    "isal",
    "lmdb>=3.0.0",
    "pywb>=2.11.1",
    "uwsgi>=2.0.31",
    "uwsgitop>=0.12",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# not a python package, only the dependencies of the pywb instances
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
