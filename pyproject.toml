[project]
name = "pywb-arquivo"
version = "0.1.0"
description = "Arquivo.pt pywb instances"
requires-python = "==3.14.*"
dependencies = [
    "lmdb>=3.0.0",
    "pywb",
    "uwsgi>=2.0.31",
    "uwsgitop>=0.12",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# not a python package, only the dependencies of the pywb instances
package = false

[tool.uv.sources]
# pywb main (after 2.10.0), with the live_url_filter config option (#1032) and
# the small read buffer of the index files (#1049)
pywb = { git = "https://github.com/webrecorder/pywb.git", rev = "9ad96b491d784035b7ed6f428744b0900e57b9f5" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
