[project]
name = "pywb-arquivo"
version = "0.1.0"
description = "Arquivo.pt pywb instances"
requires-python = "==3.14.*"
dependencies = [
    "pywb",
    "uwsgi>=2.0.31",
    "uwsgitop>=0.12",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# not a python package, only the dependencies of the pywb instances
package = false

[tool.uv.sources]
# arquivo/pywb fork, branch 2.11.0b1-patched: upstream 2.11.0b1 plus the
# closest lookup performance fixes (webrecorder/pywb#1671)
pywb = { git = "https://github.com/arquivo/pywb.git", rev = "2adc42c0faf32eb275b09295da59cc7982220af7" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
